[workspace]
resolver = "2"
members = ["./laya-burn", "./laya-ort/cli"]

# burn 0.22.0-pre.4 pins cubek-fft =0.3.0-pre.4, which was never published to
# crates.io (only 0.3.0-pre.1). The tag v0.3.0-pre.4 of the upstream repo
# carries the matching cubek-fft package.
[patch.crates-io]
cubek-fft = { git = "https://github.com/tracel-ai/cubek", tag = "v0.3.0-pre.4" }

[profile.release]
debug = false